name: ATLAS - verificações

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - '.github/workflows/atlas-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check public/app.js
          node --check public/tournaments.js
          node --check public/players.js
          node --check public/validation.js
          node --check public/opportunities-core.js
          node --check public/opportunities.js
          node --check scripts/model.mjs
          node --check scripts/series-model.mjs
          node --check public/series-radar.js
          node --check public/strength-core.js
          node --check public/strength.js
          node --check scripts/refresh.mjs
          node --check scripts/challenger.mjs
          node --check scripts/audit.mjs
          node --check scripts/prospective.mjs
          node --check public/audit.js
          node --check public/nextday.js
          node --check public/radar-core.js
          node --check public/radar-app.js
          node --check public/major-map-core.js
          node --check public/major-intelligence-core.js
          node --check public/major-series-model.js
          node --check public/major-audit-ui.js
          node --check public/major-map-workspace.js
          node --check scripts/major-preflight.mjs
          node --check scripts/radar-feed.mjs
          node --check scripts/major-bo1.mjs
          node --check scripts/major-sync.mjs
          node --check scripts/strength-sync.mjs
      - name: Testes probabilísticos e painel de chances
        run: node --test tests/model.test.mjs tests/opportunities.test.cjs tests/series-model.test.mjs tests/simulator.test.cjs tests/strength.test.cjs tests/strength-sync.test.mjs tests/audit-prospective.test.mjs tests/nextday.test.mjs tests/radar-workflow.test.mjs tests/major-opening.test.mjs tests/major-map-workspace.test.cjs tests/major-intelligence.test.cjs tests/major-series-model.test.cjs tests/major-day1-audit.test.cjs
