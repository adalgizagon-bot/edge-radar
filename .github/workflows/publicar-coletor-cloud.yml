name: Publicar coletor Crypto na Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'tests/test_cloud_worker.mjs'
      - 'tests/test_paper_agent.mjs'
      - 'tests/test_scalp.mjs'
      - 'tests/test_risk.mjs'
      - 'tests/test_exit_quote.mjs'
      - 'tests/test_discovery.mjs'
      - '.github/workflows/publicar-coletor-cloud.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Código
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras de risco e coleta
        run: node --test tests/test_scalp.mjs tests/test_paper_agent.mjs tests/test_cloud_worker.mjs tests/test_discovery.mjs tests/test_risk.mjs tests/test_exit_quote.mjs tests/test_edge_crypto.cjs tests/test_cloud_frontend.cjs tests/test_edge_signals.cjs
      - name: Validar configuração
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.EDGE_D1_DATABASE_ID }}
        run: |
          test -n "$API_TOKEN" || { echo 'Falta CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$ACCOUNT_ID" || { echo 'Falta CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          [[ "$DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'EDGE_D1_DATABASE_ID deve ser um UUID D1 válido'; exit 1; }
      - name: Configurar binding D1
        env:
          DATABASE_ID: ${{ secrets.EDGE_D1_DATABASE_ID }}
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DATABASE_ID/" cloud/wrangler.toml
      - name: Criar tabelas no D1 remoto
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest d1 execute edge-radar-crypto --remote --file=./schema.sql --yes
      - name: Publicar Worker e agendamento de 1 minuto
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Conferir API e novas tabelas publicadas
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://edge-radar-cloud.adalgizagon.workers.dev"
          for PATHNAME in "api/status" "api/risk?limit=1" "api/exit-quotes?limit=1" "api/evaluation" "api/paper"; do
            echo "Validando $PATHNAME ..."
            curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$BASE/$PATHNAME" -o /tmp/edge-health.json
            python3 -c 'import json; json.load(open("/tmp/edge-health.json"))'
          done
          echo "As rotas respondem JSON valido no Worker publicado."
      - name: Confirmar que o experimento gratuito nao chama IA
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edge-radar-cloud.adalgizagon.workers.dev/api/paper"
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 "$URL" -o /tmp/edge-paper.json
          python3 - <<'PY'
          import json
          with open('/tmp/edge-paper.json') as f:
              x=json.load(f)
          assert x.get('enabled') is True, "Teste de regras não ativado."
          assert x.get('aiConfigured') is False, "IA precisa estar desligada."
          assert isinstance(x.get('accounts'), list), "Contas simuladas inválidas."
          assert isinstance(x.get('trades'), list), "Movimentações simuladas inválidas."
          print("Teste gratuito validado; IA desligada; contas simuladas:",len(x['accounts']),"movimentações:",len(x['trades']))
          PY
      - name: Próximos passos
        run: |
          echo 'Copie o URL workers.dev do deployment e cole na aba Nuvem 24h do Edge Radar.'
          echo 'Teste /api/status: online=true apenas após pelo menos uma execução agendada bem sucedida.'
