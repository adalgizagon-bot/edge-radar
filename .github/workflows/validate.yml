name: Validate reconstruction
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python3 -m venv .runtime/venv && .runtime/venv/bin/pip install -r requirements-dev.txt
      - run: npm run build && npm run typecheck && npm run lint && npm test && npm run test:monitor
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
