name: Testar painel Minha Banca
on:
  workflow_dispatch:
  push:
    paths:
      - 'public/edge-bankroll.js'
      - 'public/edge-bankroll.css'
      - 'public/edge-picks.js'
      - 'public/index.html'
      - 'tests/test_edge_bankroll.cjs'
      - '.github/workflows/testar-banca.yml'
  pull_request:
    paths:
      - 'public/edge-bankroll.js'
      - 'public/edge-bankroll.css'
      - 'public/edge-picks.js'
      - 'public/index.html'
      - 'tests/test_edge_bankroll.cjs'
      - '.github/workflows/testar-banca.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/edge-bankroll.js
      - run: node tests/test_edge_bankroll.cjs
      - run: node tests/test_edge_picks.cjs
      - run: node tests/test_edge_strategy.cjs
