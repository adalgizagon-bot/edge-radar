name: Validar front-end Edge Radar
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/testar-radar.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/testar-radar.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe dos modulos
        run: |
          node --check public/edge-strategy.js
          node --check public/edge-picks.js
          node --check public/map-intelligence.js
      - name: Testar probabilidades, estrategias e resultados
        run: |
          node tests/test_edge_model.cjs
          node tests/test_map_intelligence.cjs
          node tests/test_edge_picks.cjs
          node tests/test_edge_strategy.cjs
