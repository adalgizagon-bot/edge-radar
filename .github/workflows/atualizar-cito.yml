name: Atualizar CS2 Edge (Cito API)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily = normal; backfill = buscar mais mapas e elencos agora (respeita teto 390/30d)'
        type: choice
        required: true
        default: daily
        options:
          - daily
          - backfill
  push:
    branches: [main]
    paths:
      - scripts/sync_cito.py
      - .github/workflows/atualizar-cito.yml
  schedule:
    - cron: '37 10 * * *'  # 07:37 horário de Brasília (quando UTC-3)
permissions:
  contents: write
concurrency:
  group: cs2-edge-cito-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar normalização e modelo
        run: |
          python -m unittest discover -s tests -v
          node tests/test_edge_model.cjs
          node tests/test_map_intelligence.cjs
      - name: Validar segredo sem revelar chave
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          if [ -z "$CITO_API_KEY" ]; then echo 'Cadastre CITO_API_KEY em Settings > Secrets and variables > Actions'; exit 1; fi
      - name: Atualizar histórico de CS2 sem odds
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          RUN_MODE: ${{ inputs.mode || 'daily' }}
        run: |
          if [ "$RUN_MODE" = 'backfill' ]; then
            python scripts/sync_cito.py --max-requests 22 --max-details 0 --max-rosters 3 --max-player-pages 16 --budget-30d 390
          else
            python scripts/sync_cito.py --max-requests 12 --max-details 0 --max-rosters 2 --max-player-pages 7 --budget-30d 390
          fi
      - name: Salvar snapshot (se mudou)
        run: |
          git config user.name 'cs2-edge-bot'
          git config user.email 'cs2-edge-bot@users.noreply.github.com'
          git add public/data/snapshot.json data/request_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar histórico CS2 (Cito)'
            git push
          fi