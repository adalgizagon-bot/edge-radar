name = "edge-radar-monitor-staging"
main = "worker.mjs"
compatibility_date = "2026-11-13"
workers_dev = false

[vars]
MONITOR_ENABLED = "false"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "MONITOR_DB"
database_name = "edge-radar-monitor-staging"
database_id = "REPLACE_WITH_NEW_STAGING_DATABASE_ID"
