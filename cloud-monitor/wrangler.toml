name = "edge-radar-monitor-staging"
main = "worker.mjs"
compatibility_date = "2026-11-13"
workers_dev = false

[vars]
MONITOR_ENABLED = "false"
# Explicit second session, initially closed; never roll over to another authorization.
PILOT_AUTHORIZATION_ID = "f76a47ef-7d0d-45ae-89ef-3f736b112307"
# A one-shot integration probe must be requested explicitly; never runs by default.
SHUTDOWN_PROBE_ENABLED = "false"
PILOT_MAX_SECONDS = "600"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "MONITOR_DB"
database_name = "edge-radar-monitor-staging"
database_id = "9f2f5da7-fa94-4a66-afc8-664e958cd80e"

# Workers Free enforces its native CPU ceiling; custom limits require Paid.
[observability]
enabled = true
head_sampling_rate = 1
